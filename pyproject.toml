[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-normalize"
version = "1.0.2"
description = "把「一打印就乱码」的 PDF 规范化成任何打印机都能打印的文件（零字体版）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pdf-normalize contributors" }]
keywords = ["pdf", "printing", "garbled", "font", "cjk", "ghostscript", "poppler"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Utilities",
]

[project.scripts]
pdf-normalize = "pdf_normalize:main"

[project.urls]
Homepage = "https://github.com/jiggersong/pdf-normalization"
Repository = "https://github.com/jiggersong/pdf-normalization"

[tool.setuptools]
py-modules = ["pdf_normalize"]
